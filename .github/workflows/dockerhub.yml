name: Build & Push Redpanda SASL Bootstrap

on:
  push:
    branches: [ redpanda-master ]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            jesuscabrerareveles/redpanda-sasl-bootstrap:latest
            jesuscabrerareveles/redpanda-sasl-bootstrap:${{ github.ref_name }}